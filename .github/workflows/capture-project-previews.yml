name: Capture website screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capture-project-previews.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Screenshot the public project websites
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({
              viewport: {width: 1365, height: 860},
              deviceScaleFactor: 1,
              colorScheme: 'light',
              reducedMotion: 'reduce'
            });
            const sites = [
              ['https://byucalendar.com/', 'assets/byu-calendar-screenshot.png'],
              ['https://jarin.dev/static/projects/career-launchpad/index.html', 'assets/career-launchpad-screenshot.png']
            ];
            for (const [url, path] of sites) {
              await page.goto(url, {waitUntil: 'domcontentloaded', timeout: 60000});
              await page.waitForTimeout(6500);
              await page.screenshot({path, animations: 'disabled'});
              console.log('Saved screenshot of', url, 'to', path);
            }
            await browser.close();
          })().catch(error => {console.error(error); process.exit(1)});
          NODE

      - name: Save screenshots to the portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/byu-calendar-screenshot.png assets/career-launchpad-screenshot.png
          if git diff --cached --quiet; then
            echo "Screenshots already up to date."
          else
            git commit -m "Add real website screenshots"
            git push
          fi
